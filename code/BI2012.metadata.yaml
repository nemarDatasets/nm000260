file_format: mat, csv
methodology: 'The visual P300 is an event-related potential (ERP) elicited by a visual stimulation, peaking 240-600 ms after
  stimulus onset. The experiment features a training-test mode of operation and both a longitudinal and transversal design.
  Training session: Target alien chosen randomly at each repetition, 8 Targets total, 8 repetitions each, resulting in 128
  Target trials and 640 non-Target flashes. Online session: consisted of three levels with different distractor configurations,
  minimum 3.5 minutes per level, counter-balanced order across subjects. Interface: 36 aliens flashing in 12 groups of 6,
  each repetition has 12 flashes (2 Target, 10 non-Target). P300 peak latency: 240-600 ms post-stimulus.'
